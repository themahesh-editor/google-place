name: AttachAI Outreach Tests

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements-outreach.txt'
      - '.github/workflows/outreach-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements-outreach.txt'
      - '.github/workflows/outreach-tests.yml'
  workflow_dispatch:

concurrency:
  group: attachai-outreach-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-outreach.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
