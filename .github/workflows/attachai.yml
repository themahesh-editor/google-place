name: AttachAI production

on:
  schedule:
    # Polls only. monitor.yaml decides whether outreach/followups are due.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Destructively clear application runtime data (never for recovery)'
        type: boolean
        default: false
        required: true
      target_new_initials:
        description: 'Successful NEW initial sends in this logical campaign (unchanged on recovery)'
        type: number
        default: 100
        required: true
      send_enabled:
        description: 'Permit SMTP sends (also requires dry_run=false)'
        type: boolean
        default: false
        required: true
      dry_run:
        description: 'Prepare/validate without SMTP acceptance or SENT counts'
        type: boolean
        default: true
        required: true
      process_followups:
        description: 'Sync inbound events and process due follow-ups'
        type: boolean
        default: true
        required: true
      process_new_outreach:
        description: 'Prepare/send NEW initial outreach'
        type: boolean
        default: true
        required: true

permissions:
  contents: read
concurrency:
  group: attachai-production
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SENDER_ACCOUNTS_JSON: ${{ secrets.SENDER_ACCOUNTS_JSON }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Safe scheduled poll
        if: github.event_name == 'schedule'
        run: python -m attachai.cli scheduled
      - name: Manual campaign
        if: github.event_name == 'workflow_dispatch'
        # Never interpolate untrusted workflow inputs into executable shell text.
        env:
          INPUT_RESET: ${{ inputs.reset_state }}
          INPUT_TARGET: ${{ inputs.target_new_initials }}
          INPUT_SEND: ${{ inputs.send_enabled }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_FOLLOWUPS: ${{ inputs.process_followups }}
          INPUT_OUTREACH: ${{ inputs.process_new_outreach }}
        run: |
          python -m attachai.cli run \
            --reset-state "$INPUT_RESET" \
            --target-new-initials "$INPUT_TARGET" \
            --send-enabled "$INPUT_SEND" \
            --dry-run "$INPUT_DRY" \
            --process-followups "$INPUT_FOLLOWUPS" \
            --process-new-outreach "$INPUT_OUTREACH"
