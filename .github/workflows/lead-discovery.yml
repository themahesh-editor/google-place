name: Daily Verified Lead Discovery

on:
  schedule:
    # 23:47 IST / 18:17 UTC; non-zero minute reduces top-of-hour load risk.
    - cron: '20 6 * * *'
  workflow_dispatch:

concurrency:
  group: google-place-lead-discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Discover verified leads
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          NVIDIA_TIMEOUT_SECONDS: 90
          NVIDIA_MAX_TOKENS: 600

          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

          # Experiment target
          TARGET_VERIFIED_LEADS: 100

          # Allowed global countries
          ALLOWED_COUNTRY_CODES: US,CA,GB,AU

          MAX_PLACES_SEARCH_REQUESTS: 30
          MAX_RAW_CANDIDATES: 500
          SEARCH_PAGE_SIZE: 20
          SEARCH_DELAY_SECONDS: 2
          MAX_PAGES_PER_WEBSITE: 5
          HTTP_TIMEOUT_SECONDS: 10
          HONOR_ROBOTS: 'true'
          WEBSITE_REQUEST_DELAY_SECONDS: 0.25
          NO_EMAIL_RETRY_DAYS: 7
          TRANSIENT_RETRY_DAYS: 1
          MAX_RETRY_CANDIDATES_PER_RUN: 10
          RETRY_QUEUE_FILE: retry_queue.csv

        run: python lead_collector.py

      - name: Commit CRM and memory
        if: ${{ always() }}
        run: |
          git config user.name "Lead Discovery Bot"
          git config user.email "actions@github.com"

          git add leads_crm.csv seen_domains.csv candidate_memory.jsonl retry_queue.csv run_log.jsonl

          git diff --cached --quiet && exit 0

          git commit -m "Update verified lead discovery data [skip ci]"

          git pull --rebase origin main

          git push origin HEAD:main
