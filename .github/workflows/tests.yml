name: AttachAI CI (no real sends)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attachai
          POSTGRES_PASSWORD: attachai
          POSTGRES_DB: attachai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attachai -d attachai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://attachai:attachai@localhost:5432/attachai_test
      # No production secrets, API credentials or real mailbox accounts in CI.
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
