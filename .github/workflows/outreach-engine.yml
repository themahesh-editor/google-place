name: AttachAI Outreach Engine

on:
  schedule:
    # 17:00 IST / 11:30 UTC; GitHub may delay scheduled workflows.
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'all'
        type: choice
        options: [all, research_only, personalization_only, send_only, followup_only, mailbox_check_only, dry_run]
      dry_run:
        description: 'Never send real mail when true'
        required: true
        default: true
        type: boolean
      send_enabled:
        description: 'Allow real SMTP sends; requires DB + 10 sender secrets'
        required: true
        default: false
        type: boolean
      target_lead_count:
        description: 'Maximum CRM leads to process this run'
        required: true
        default: 100
        type: number
      sender_test_mode:
        description: 'Validate SMTP connections only; never send messages'
        required: true
        default: false
        type: boolean

concurrency:
  group: attachai-outreach-operational
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      OUTREACH_DATABASE_URL: ${{ secrets.OUTREACH_DATABASE_URL }}
      SENDER_1: ${{ secrets.SENDER_1 }}
      SENDER_2: ${{ secrets.SENDER_2 }}
      SENDER_3: ${{ secrets.SENDER_3 }}
      SENDER_4: ${{ secrets.SENDER_4 }}
      SENDER_5: ${{ secrets.SENDER_5 }}
      SENDER_6: ${{ secrets.SENDER_6 }}
      SENDER_7: ${{ secrets.SENDER_7 }}
      SENDER_8: ${{ secrets.SENDER_8 }}
      SENDER_9: ${{ secrets.SENDER_9 }}
      SENDER_10: ${{ secrets.SENDER_10 }}
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'Asia/Kolkata' }}
      SENDER_1_EMAIL: ${{ vars.SENDER_1_EMAIL || '' }}
      SENDER_2_EMAIL: ${{ vars.SENDER_2_EMAIL || '' }}
      SENDER_3_EMAIL: ${{ vars.SENDER_3_EMAIL || '' }}
      SENDER_4_EMAIL: ${{ vars.SENDER_4_EMAIL || '' }}
      SENDER_5_EMAIL: ${{ vars.SENDER_5_EMAIL || '' }}
      SENDER_6_EMAIL: ${{ vars.SENDER_6_EMAIL || '' }}
      SENDER_7_EMAIL: ${{ vars.SENDER_7_EMAIL || '' }}
      SENDER_8_EMAIL: ${{ vars.SENDER_8_EMAIL || '' }}
      SENDER_9_EMAIL: ${{ vars.SENDER_9_EMAIL || '' }}
      SENDER_10_EMAIL: ${{ vars.SENDER_10_EMAIL || '' }}
      DAILY_NEW_LEADS_TARGET: ${{ vars.DAILY_NEW_LEADS_TARGET || '100' }}
      DAILY_NEW_OUTREACH_TARGET: ${{ vars.DAILY_NEW_OUTREACH_TARGET || '100' }}
      SENDER_COUNT: ${{ vars.SENDER_COUNT || '10' }}
      DAILY_NEW_OUTREACH_LIMIT_PER_SENDER: ${{ vars.DAILY_NEW_OUTREACH_LIMIT_PER_SENDER || '10' }}
      DAILY_FOLLOWUP_LIMIT_PER_SENDER: ${{ vars.DAILY_FOLLOWUP_LIMIT_PER_SENDER || '10' }}
      DAILY_TOTAL_LIMIT_PER_SENDER: ${{ vars.DAILY_TOTAL_LIMIT_PER_SENDER || '40' }}
      SEND_INTERVAL_MINUTES: ${{ vars.SEND_INTERVAL_MINUTES || '10' }}
      FOLLOWUP_1_DELAY_HOURS: ${{ vars.FOLLOWUP_1_DELAY_HOURS || '24' }}
      FOLLOWUP_2_DELAY_DAYS: ${{ vars.FOLLOWUP_2_DELAY_DAYS || '7' }}
      FOLLOWUP_3_DELAY_DAYS: ${{ vars.FOLLOWUP_3_DELAY_DAYS || '14' }}
      SENDING_WINDOW_START: ${{ vars.SENDING_WINDOW_START || '18:00' }}
      SENDING_WINDOW_END: ${{ vars.SENDING_WINDOW_END || '20:00' }}
      MAILBOX_PROVIDER: ${{ vars.MAILBOX_PROVIDER || 'imap' }}
      IMAP_HOST: ${{ vars.IMAP_HOST || 'imap.gmail.com' }}
      IMAP_PORT: ${{ vars.IMAP_PORT || '993' }}
      IMAP_USE_SSL: ${{ vars.IMAP_USE_SSL || 'true' }}
      MAILBOX_CHECK_LOOKBACK_MINUTES: ${{ vars.MAILBOX_CHECK_LOOKBACK_MINUTES || '180' }}
      MAILBOX_MAX_MESSAGES_PER_RUN: ${{ vars.MAILBOX_MAX_MESSAGES_PER_RUN || '100' }}
      REQUIRE_FRESH_MAILBOX_CHECK_BEFORE_FOLLOWUP: ${{ vars.REQUIRE_FRESH_MAILBOX_CHECK_BEFORE_FOLLOWUP || 'true' }}
      MAX_CONCURRENT_SENDS: ${{ vars.MAX_CONCURRENT_SENDS || '1' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      RETRY_BASE_SECONDS: ${{ vars.RETRY_BASE_SECONDS || '60' }}
      RESEARCH_PROMPT_VERSION: ${{ vars.RESEARCH_PROMPT_VERSION || '1.0' }}
      OUTREACH_PROMPT_VERSION: ${{ vars.OUTREACH_PROMPT_VERSION || '1.0' }}
      FOLLOWUP_PROMPT_VERSION: ${{ vars.FOLLOWUP_PROMPT_VERSION || '1.0' }}
      QUALITY_PROMPT_VERSION: ${{ vars.QUALITY_PROMPT_VERSION || '1.0' }}
      MIN_PERSONALIZATION_CONFIDENCE: ${{ vars.MIN_PERSONALIZATION_CONFIDENCE || '0.75' }}
      NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b' }}
      NVIDIA_TIMEOUT_SECONDS: ${{ vars.NVIDIA_TIMEOUT_SECONDS || '90' }}
      HONOR_ROBOTS: ${{ vars.HONOR_ROBOTS || 'true' }}
      CRAWLER_TIMEOUT_SECONDS: ${{ vars.CRAWLER_TIMEOUT_SECONDS || '15' }}
      CRAWLER_MAX_BYTES: ${{ vars.CRAWLER_MAX_BYTES || '2000000' }}
      CRAWLER_MAX_PAGES: ${{ vars.CRAWLER_MAX_PAGES || '10' }}
      CRAWLER_REQUEST_DELAY_SECONDS: ${{ vars.CRAWLER_REQUEST_DELAY_SECONDS || '0.25' }}
      SEND_ENABLED: ${{ github.event_name == 'schedule' && 'true' || inputs.send_enabled || 'false' }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
      SENDER_TEST_MODE: ${{ github.event_name == 'schedule' && 'false' || inputs.sender_test_mode || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-outreach.txt
      - name: Run outreach unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute outreach engine
        env:
          OUTREACH_MODE: ${{ github.event_name == 'schedule' && 'all' || inputs.mode || 'dry_run' }}
          TARGET_LEAD_COUNT: ${{ github.event_name == 'schedule' && '100' || inputs.target_lead_count || '100' }}
        run: python -m app.main "$OUTREACH_MODE" --lead-limit "$TARGET_LEAD_COUNT"
