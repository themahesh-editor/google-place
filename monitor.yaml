# Main control plane. Credentials belong ONLY in environment/GitHub Secrets.
automation:
  enabled: false
  outreach_cron: "0 9 * * 1-5"
  followups_cron: "0 */4 * * *"
  timezone: UTC
safety:
  emergency_stop: false
  send_enabled: false
  dry_run: true
outreach:
  enabled: true
  target_new_initials: 100
  batch_size: 10
  max_concurrency: 10
followups:
  enabled: true
  # Each delay is measured from the immediately preceding successful SENT stage.
  # Zero is permitted only when you intentionally want accelerated testing.
  delays_seconds: [86400, 604800, 1209600]
  max_per_run: 1000
limits:
  send_window_enabled: false
  window_start: "09:00"
  window_end: "17:00"
  timezone: UTC
  daily_sender_enabled: false
  daily_sender: 100
  daily_total_enabled: false
  daily_total: 1000
  batch_gap_seconds: 0
  max_runtime_seconds: 18000
retry:
  max_attempts: 3
  base_seconds: 2
  max_seconds: 60
  sender_cooldown_seconds: 30
discovery:
  queries: ["dentist in Austin Texas"]
  max_requests_per_run: 100
  max_candidates_per_run: 2000
  buffer_ratio: 1.5
  min_rating: 4
  min_reviews: 5
research:
  version: v1
  max_pages: 5
  max_bytes: 1000000
  timeout_seconds: 15
  robots_enabled: true
  max_evidence: 12
llm:
  base_url: https://integrate.api.nvidia.com/v1
  model: openai/gpt-oss-20b
  timeout_seconds: 60
  offer: AttachAI helps businesses respond to customer inquiries with an AI assistant.
  signature: AttachAI team
  # REQUIRED before real sends: your genuine postal address, not a placeholder.
  postal_address: ""
mailbox:
  enabled: true
  lookback_days: 30
  max_messages_per_sender: 1000
  timeout_seconds: 20
